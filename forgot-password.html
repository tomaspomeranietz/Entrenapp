<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña — Entrenapp</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
  </head>
  <body class="auth-checking">
    <header class="site-header"><site-header></site-header></header>

    <main class="page-main app-content">
      <div class="container">
        <div class="card auth-card">
          <h1>Recuperar contraseña</h1>
          <p class="text-secondary" style="margin-bottom: 16px">
            Te mandamos un link para elegir una contraseña nueva.
          </p>
          <form id="forgot-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input class="input" type="email" id="email" name="email" required autocomplete="email" />
            </div>
            <button class="btn btn--primary btn--block" type="submit">Enviar link</button>
          </form>
          <p class="auth-card__foot"><a href="login.html">Volver a ingresar</a></p>
        </div>
      </div>
    </main>

    <script type="module" src="js/pages/forgot-password.js"></script>
  </body>
</html>
