<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elegir contraseña nueva — Entrenapp</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
  </head>
  <body class="auth-checking">
    <header class="site-header"><site-header></site-header></header>

    <main class="page-main app-content">
      <div class="container">
        <div class="card auth-card">
          <h1>Elegí una contraseña nueva</h1>
          <form id="reset-form" novalidate hidden>
            <div class="field">
              <label for="password">Contraseña nueva</label>
              <input
                class="input"
                type="password"
                id="password"
                name="password"
                required
                minlength="6"
                autocomplete="new-password"
              />
            </div>
            <button class="btn btn--primary btn--block" type="submit">Guardar contraseña</button>
          </form>
          <div id="invalid-link" hidden>
            <p class="text-secondary">Este link no es válido o ya venció.</p>
            <a class="btn btn--outline" href="forgot-password.html">Pedir uno nuevo</a>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="js/pages/reset-password.js"></script>
  </body>
</html>
