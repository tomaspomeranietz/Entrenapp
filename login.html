<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar — Entrenapp</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
  </head>
  <body class="auth-checking">
    <header class="site-header"><site-header></site-header></header>

    <main class="page-main app-content">
      <div class="container">
        <div class="card auth-card">
          <h1>Ingresar</h1>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input class="input" type="email" id="email" name="email" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="password">Contraseña</label>
              <input
                class="input"
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
              />
            </div>
            <button class="btn btn--primary btn--block" type="submit">Ingresar</button>
          </form>
          <p class="auth-card__foot"><a href="forgot-password.html">Olvidé mi contraseña</a></p>
          <p class="auth-card__foot">¿No tenés cuenta? <a href="signup.html">Registrate</a></p>
        </div>
      </div>
    </main>

    <script type="module" src="js/pages/login.js"></script>
  </body>
</html>
